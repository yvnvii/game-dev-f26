name: midterm-yvnvii

on:
  pull_request:
    paths:
      - "midterms/yvnvii/**"
      - ".github/workflows/midterm-yvnvii.yml"

permissions:
  contents: read

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: midterms/yvnvii
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deterministic checks need only pytest; the live model SDK is not installed and no secrets are used.
      - run: pip install "pytest>=8"
      - run: python -m pytest -v
